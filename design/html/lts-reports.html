<title>รายงาน · LTS Solution</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Public+Sans:ital,wght@0,400..700;1,400&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">

<style>
/* ===== LTS Solution design tokens (generated from tokens.json) ===== */
:root {
  --canvas: #3f538c;
  --on-canvas: #ffffff;
  --on-canvas-muted: #d8d9d9;
  --canvas-rule: #5b6da0;
  --surface: #ffffff;
  --surface-sunken: #f7f8fa;
  --surface-hover: #eef1f7;
  --border: #e2e5eb;
  --border-input: #8a92a2;
  --ink: #141b2b;
  --ink-2: #3a4357;
  --muted: #5d6576;
  --placeholder: #6b7385;
  --primary: #22407a;
  --primary-hover: #1a3262;
  --primary-soft: #e8edf7;
  --on-primary: #ffffff;
  --gold: #d9a53b;
  --gold-hover: #c8932a;
  --gold-soft: #fbf1dc;
  --gold-text: #7f5a12;
  --on-gold: #1f1605;
  --teal: #0e6e6c;
  --teal-soft: #e0f2f1;
  --teal-text: #0b5856;
  --rose: #a8365a;
  --rose-soft: #fbe7ee;
  --rose-text: #8c2b4a;
  --success: #1b7a48;
  --success-soft: #e3f3e8;
  --success-text: #176239;
  --warning: #c26a0a;
  --warning-soft: #fdefd6;
  --warning-text: #874604;
  --danger: #c02a2a;
  --danger-hover: #a11f22;
  --danger-soft: #fce5e4;
  --danger-text: #a11f22;
  --info: #1f6fb2;
  --info-soft: #e1eef9;
  --info-text: #1a5a91;
  --neutral-soft: #eceef2;
  --neutral-text: #3a4357;
  --sidebar-bg: #101b30;
  --sidebar-raised: #1d2b47;
  --sidebar-text: #c3cada;
  --sidebar-muted: #8e98ae;
  --sidebar-active: #ffffff;
  --focus: #2e6be6;
  --overlay: rgba(16, 27, 48, 0.55);
  --shadow-1: {'light': '0 1px 2px rgba(16, 27, 48, 0.06), 0 0 0 1px rgba(16, 27, 48, 0.05)'};
  --shadow-2: {'light': '0 6px 16px -4px rgba(16, 27, 48, 0.14), 0 0 0 1px rgba(16, 27, 48, 0.06)'};
  --shadow-3: {'light': '0 24px 48px -12px rgba(16, 27, 48, 0.32)'};
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 999px;
  --sidebar-width: 264px;
  --sidebar-collapsed: 76px;
  --topbar-height: 64px;
  --content-max: 1600px;
  --control-height: 40px;
  --row-height: 52px;
  --z-sidebar: 20;
  --z-menu: 40;
  --z-modal: 60;
  --font-display: "Bricolage Grotesque", "IBM Plex Sans Thai", "Public Sans", system-ui, sans-serif;
  --font-sans: "Public Sans", "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ===== LTS Solution component styles (components/bundle.css) ===== */
/* LTS Solution components — every value comes from tokens.json */
.gg, .gg *, [class^="gg-"], [class*=" gg-"] { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink-2); font-family: var(--font-sans); font-size: 14px; line-height: 20px; }
.gg-num { font-variant-numeric: tabular-nums; }
.gg-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; }
.gg-stack { display: flex; flex-direction: column; gap: var(--space-4); }
.gg-stack > *, .gg-shell-content > * { min-width: 0; }
.gg-pad { padding: var(--space-6); }
.gg :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.gg-icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.gg-icon.sm { width: 16px; height: 16px; }
.gg-icon.lg { width: 22px; height: 22px; }
.gg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Button */
.gg-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-height); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid transparent; font: 600 14px/20px var(--font-sans); cursor: pointer; white-space: nowrap; transition: background-color .12s, border-color .12s, color .12s; }
.gg-btn.sm { height: 32px; padding: 0 var(--space-3); font-size: 13px; }
.gg-btn.lg { height: 48px; padding: 0 var(--space-6); font-size: 15px; }
.gg-btn.icon-only { width: var(--control-height); padding: 0; }
.gg-btn.sm.icon-only { width: 32px; }
.gg-btn-primary { background: var(--primary); color: var(--on-primary); }
.gg-btn-primary:hover { background: var(--primary-hover); }
.gg-btn-secondary { background: var(--surface); color: var(--primary); border-color: var(--border-input); }
.gg-btn-secondary:hover { background: var(--surface-hover); border-color: var(--primary); }
.gg-btn-danger { background: var(--danger); color: var(--on-primary); }
.gg-btn-danger:hover { background: var(--danger-hover); }
.gg-btn-gold { background: var(--gold); color: var(--on-gold); }
.gg-btn-gold:hover { background: var(--gold-hover); }
.gg-btn-ghost { background: transparent; color: var(--ink-2); }
.gg-btn-ghost:hover { background: var(--surface-hover); color: var(--ink); }
.gg-btn[disabled], .gg-btn[aria-busy="true"] { cursor: not-allowed; opacity: .45; }
.gg-btn-ghost.danger { color: var(--danger); }

/* Badge */
.gg-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--radius-sm); font: 600 12px/16px var(--font-sans); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gg-badge-dot { width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
.gg-badge.success { background: var(--success-soft); color: var(--success-text); }
.gg-badge.warning { background: var(--warning-soft); color: var(--warning-text); }
.gg-badge.danger { background: var(--danger-soft); color: var(--danger-text); }
.gg-badge.info { background: var(--info-soft); color: var(--info-text); }
.gg-badge.neutral { background: var(--neutral-soft); color: var(--neutral-text); }
.gg-badge.gold { background: var(--gold-soft); color: var(--gold-text); }
.gg-badge.primary { background: var(--primary-soft); color: var(--primary); }
.gg-badge.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 500; letter-spacing: .02em; }

/* Field + controls */
.gg-field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; }
.gg-field.span-2 { grid-column: 1 / -1; }
.gg-label { font: 600 13px/18px var(--font-sans); color: var(--ink); }
.gg-req { color: var(--danger); margin-left: 2px; }
.gg-hint { font: 500 12px/16px var(--font-sans); color: var(--muted); }
.gg-error { font: 500 12px/16px var(--font-sans); color: var(--danger-text); }
.gg-control { position: relative; display: flex; align-items: stretch; height: var(--control-height); background: var(--surface); border: 1px solid var(--border-input); border-radius: var(--radius-md); transition: border-color .12s, box-shadow .12s; }
.gg-control:hover { border-color: var(--ink-2); }
.gg-control:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1px var(--focus); }
.gg-control input:focus-visible, .gg-control select:focus-visible, .gg-control textarea:focus-visible { outline: none; }
.gg-control.invalid { border-color: var(--danger); }
.gg-control.disabled { background: var(--surface-sunken); border-color: var(--border); }
.gg-control.textarea { height: auto; }
.gg-control input, .gg-control select, .gg-control textarea { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0 var(--space-4); font: 400 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; border-radius: var(--radius-md); }
.gg-control textarea { padding: 10px var(--space-4); min-height: 96px; resize: vertical; }
.gg-control select { appearance: none; padding-right: 40px; cursor: pointer; }
.gg-control ::placeholder { color: var(--placeholder); opacity: 1; }
.gg-control .gg-lead { display: flex; align-items: center; padding-left: var(--space-3); color: var(--muted); }
.gg-control .gg-lead + input { padding-left: var(--space-2); }
.gg-control .gg-caret { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.gg-addon { display: flex; align-items: center; padding: 0 var(--space-4); background: var(--surface-sunken); color: var(--muted); font: 600 13px/18px var(--font-sans); border-left: 1px solid var(--border); border-radius: 0 calc(var(--radius-md) - 1px) calc(var(--radius-md) - 1px) 0; }
.gg-addon.btn { background: var(--primary); color: var(--on-primary); border-left: 0; cursor: pointer; border: 0; }
.gg-stepper { display: inline-flex; height: 36px; border: 1px solid var(--border-input); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.gg-stepper button { width: 36px; border: 0; background: var(--surface-sunken); color: var(--primary); cursor: pointer; display: grid; place-items: center; }
.gg-stepper button:hover { background: var(--primary-soft); }
.gg-stepper input { width: 52px; border: 0; border-left: 1px solid var(--border); border-right: 1px solid var(--border); text-align: center; font: 600 14px/20px var(--font-sans); color: var(--ink); font-variant-numeric: tabular-nums; outline: 0; }

/* Card + FormCard */
.gg-card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
.gg-card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-5) var(--space-6) 0; }
.gg-card-title { margin: 0; font: 700 18px/24px var(--font-display); color: var(--ink); }
.gg-card-sub { margin: 2px 0 0; font: 500 12px/16px var(--font-sans); color: var(--muted); }
.gg-card-body { padding: var(--space-5) var(--space-6) var(--space-6); }
.gg-card-foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border); }
.gg-form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-5) var(--space-6); }
.gg-form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.gg-form-section { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); font: 700 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.gg-form-section::after { content: ""; flex: 1; height: 1px; background: var(--border); }

/* StatCard */
.gg-stat { position: relative; display: flex; align-items: center; gap: var(--space-4); min-height: 112px; padding: var(--space-5) var(--space-6); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); overflow: hidden; }
.gg-stat-icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: var(--radius-md); flex: none; }
.gg-stat-body { min-width: 0; }
.gg-stat-label { font: 600 13px/18px var(--font-sans); }
.gg-stat-value { margin-top: 2px; font: 800 28px/32px var(--font-display); letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gg-stat-delta { margin-top: 4px; font: 600 12px/16px var(--font-sans); }
.gg-stat.strong { color: var(--on-primary); }
.gg-stat.strong .gg-stat-icon { background: rgba(255, 255, 255, 0.14); }
.gg-stat.strong .gg-stat-label, .gg-stat.strong .gg-stat-delta { opacity: .86; }
.gg-stat.strong.navy { background: var(--primary); }
.gg-stat.strong.teal { background: var(--teal); }
.gg-stat.strong.rose { background: var(--rose); }
.gg-stat.strong.gold { background: var(--gold); color: var(--on-gold); }
.gg-stat.strong.gold .gg-stat-icon { background: rgba(31, 22, 5, 0.1); }
.gg-stat.soft { background: var(--surface); }
.gg-stat.soft .gg-stat-value { color: var(--ink); }
.gg-stat.soft .gg-stat-label { color: var(--muted); }
.gg-stat.soft.navy .gg-stat-icon { background: var(--primary-soft); color: var(--primary); }
.gg-stat.soft.gold .gg-stat-icon { background: var(--gold-soft); color: var(--gold-text); }
.gg-stat.soft.teal .gg-stat-icon { background: var(--teal-soft); color: var(--teal-text); }
.gg-stat.soft.rose .gg-stat-icon { background: var(--rose-soft); color: var(--rose-text); }
.gg-stat.soft .gg-stat-delta.up { color: var(--success-text); }
.gg-stat.soft .gg-stat-delta.down { color: var(--danger-text); }
.gg-stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }

/* DataTable */
.gg-table-card { min-width: 0; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-1); }
.gg-table-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-5) var(--space-6); }
.gg-table-wrap { overflow-x: auto; }
.gg-table { width: 100%; border-collapse: separate; border-spacing: 0; font: 400 14px/20px var(--font-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.gg-table th { position: sticky; top: 0; height: 44px; padding: 0 var(--space-4); background: var(--surface-sunken); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); text-align: left; font: 700 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.gg-table th:first-child, .gg-table td:first-child { padding-left: var(--space-6); }
.gg-table th:last-child, .gg-table td:last-child { padding-right: var(--space-6); }
.gg-table th.sortable { cursor: pointer; }
.gg-table th.sortable:hover { color: var(--ink); }
.gg-table th .gg-sort { display: inline-flex; vertical-align: -3px; margin-left: 4px; }
.gg-table td { height: var(--row-height); padding: 0 var(--space-4); border-bottom: 1px solid var(--border); white-space: nowrap; }
.gg-table.compact td { height: 44px; }
.gg-table .right { text-align: right; }
.gg-table .center { text-align: center; }
.gg-table td.primary { color: var(--ink); font-weight: 600; }
.gg-table tbody tr { transition: background-color .08s; }
.gg-table tbody tr:hover { background: var(--surface-hover); }
.gg-table tbody tr.selected { background: var(--primary-soft); }
.gg-table tfoot td { height: 52px; border-bottom: 0; background: var(--surface-sunken); color: var(--ink); font-weight: 700; }
.gg-table .gg-check { width: 16px; height: 16px; accent-color: var(--primary); }
.gg-thumb { width: 40px; height: 40px; border-radius: var(--radius-md); background: var(--surface-sunken); object-fit: cover; display: block; border: 1px solid var(--border); }
.gg-empty { padding: var(--space-12) var(--space-6); text-align: center; color: var(--muted); }
.gg-actions-cell { width: 56px; }
.gg-menu-anchor { position: relative; display: inline-block; }
.gg-menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: var(--z-menu); min-width: 184px; padding: 6px; background: var(--surface); border-radius: var(--radius-md); box-shadow: var(--shadow-2); text-align: left; }
.gg-menu.up { top: auto; bottom: calc(100% + 4px); }
.gg-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; background: none; border-radius: var(--radius-sm); font: 500 14px/20px var(--font-sans); color: var(--ink-2); cursor: pointer; text-align: left; }
.gg-menu-item:hover { background: var(--surface-hover); color: var(--ink); }
.gg-menu-item.danger { color: var(--danger-text); }
.gg-menu-item.danger:hover { background: var(--danger-soft); }
.gg-menu-sep { height: 1px; margin: 6px 4px; background: var(--border); }

/* Pagination */
.gg-pager { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-4) var(--space-6); font: 500 13px/18px var(--font-sans); color: var(--muted); }
.gg-pager-size { display: flex; align-items: center; gap: var(--space-2); }
.gg-pager-size .gg-control { height: 32px; width: 76px; }
.gg-pager-size select { padding: 0 28px 0 10px; font-size: 13px; }
.gg-pager-pages { display: flex; align-items: center; gap: 4px; }
.gg-page { min-width: 32px; height: 32px; padding: 0 8px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-2); font: 600 13px/18px var(--font-sans); cursor: pointer; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.gg-page:hover { background: var(--surface-hover); }
.gg-page.active { background: var(--primary); color: var(--on-primary); }
.gg-page[disabled] { opacity: .4; cursor: default; background: transparent; }

/* Modal */
.gg-scrim { position: fixed; inset: 0; z-index: var(--z-modal); display: grid; place-items: center; padding: var(--space-8); background: var(--overlay); }
.gg-scrim.inline { position: relative; inset: auto; min-height: 100%; }
.gg-modal { width: 100%; max-width: 560px; max-height: calc(100vh - 64px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-3); }
.gg-modal.sm { max-width: 420px; }
.gg-modal.lg { max-width: 800px; }
.gg-modal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: var(--space-5) var(--space-6); border-bottom: 1px solid var(--border); }
.gg-modal-title { margin: 0; font: 700 18px/24px var(--font-display); color: var(--ink); }
.gg-modal-body { padding: var(--space-6); overflow-y: auto; }
.gg-modal-foot { display: flex; justify-content: flex-end; gap: var(--space-2); padding: var(--space-4) var(--space-6); border-top: 1px solid var(--border); }
.gg-modal-confirm { display: flex; gap: var(--space-4); }
.gg-modal-confirm .gg-stat-icon { background: var(--danger-soft); color: var(--danger); }

/* Sidebar */
.gg-sidebar { position: sticky; top: 0; z-index: var(--z-sidebar); height: 100vh; width: var(--sidebar-width); flex: none; display: flex; flex-direction: column; background: var(--sidebar-bg); color: var(--sidebar-text); transition: width .18s ease; }
.gg-sidebar.static { position: relative; height: auto; min-height: 100%; }
.gg-sidebar.collapsed { width: var(--sidebar-collapsed); }
.gg-sidebar :focus-visible { outline-color: var(--gold); }
.gg-brand { display: flex; align-items: center; gap: var(--space-3); height: var(--topbar-height); padding: 0 var(--space-5); border-bottom: 1px solid var(--sidebar-raised); flex: none; }
.gg-brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: var(--radius-md); background: var(--gold); color: var(--on-gold); font: 800 17px/1 var(--font-display); flex: none; }
.gg-brand-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }
.gg-brand-name { font: 700 18px/24px var(--font-display); color: var(--sidebar-active); white-space: nowrap; letter-spacing: -0.01em; }
.gg-brand-name b { color: var(--gold); font-weight: 700; }
.gg-nav { flex: 1; overflow-y: auto; padding: var(--space-4) var(--space-3); scrollbar-width: thin; scrollbar-color: var(--sidebar-raised) transparent; }
.gg-nav-label { padding: var(--space-4) var(--space-3) var(--space-2); font: 700 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--sidebar-muted); white-space: nowrap; }
.gg-nav-item { position: relative; display: flex; align-items: center; gap: var(--space-3); width: 100%; height: 40px; padding: 0 var(--space-3); margin-bottom: 2px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--sidebar-text); font: 500 14px/20px var(--font-sans); text-align: left; cursor: pointer; white-space: nowrap; text-decoration: none; }
.gg-nav-item:hover { background: var(--sidebar-raised); color: var(--sidebar-active); }
.gg-nav-item.active { background: var(--sidebar-raised); color: var(--sidebar-active); font-weight: 600; }
.gg-nav-item.active::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--gold); }
.gg-nav-item.active .gg-icon { color: var(--gold); }
.gg-nav-item.open-parent { color: var(--sidebar-active); }
.gg-nav-item .gg-nav-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.gg-nav-item .gg-chev { color: var(--sidebar-muted); transition: transform .15s; }
.gg-nav-item[aria-expanded="true"] .gg-chev { transform: rotate(90deg); }
.gg-nav-count { min-width: 22px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--gold); color: var(--on-gold); font: 700 11px/20px var(--font-sans); text-align: center; }
.gg-subnav { margin: 2px 0 6px; padding-left: 30px; position: relative; }
.gg-subnav::before { content: ""; position: absolute; left: 20px; top: 4px; bottom: 4px; width: 1px; background: var(--sidebar-raised); }
.gg-subnav .gg-nav-item { height: 36px; font-size: 13px; }
.gg-subnav .gg-nav-item.active::before { left: -11px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; }
.gg-sidebar.collapsed .gg-brand { justify-content: center; padding: 0; }

    function draw() {
      var k = calc(range.has), pct = function (a, b) { return b ? (a / b * 100).toFixed(1) + '%' : '—'; };
      $('plTiles').innerHTML =
        '<div class="pl"><div class="k">ยอดขาย (ไม่รวม VAT)</div><div class="v">' + GG.baht(k.rev) + '</div><div class="s">หักรับคืน ' + GG.baht(k.ret) + ' = ' + GG.baht(k.net) + '</div></div>' +
        '<div class="pl"><div class="k">ต้นทุนขาย</div><div class="v">' + GG.baht(k.cost) + '</div><div class="s">คิดจากต้นทุนผ้าต่อหน่วย</div></div>' +
        '<div class="pl good"><div class="k">กำไรขั้นต้น</div><div class="v">' + GG.baht(k.gross) + '</div><div class="s">อัตรากำไร ' + pct(k.gross, k.net) + '</div></div>' +
        '<div class="pl"><div class="k">ค่าใช้จ่ายดำเนินงาน</div><div class="v">' + GG.baht(k.exp) + '</div><div class="s"><a href="lts-expenses.html" style="color:var(--primary);font-weight:600;text-decoration:none">ดูรายการค่าใช้จ่าย</a></div></div>' +
        '<div class="pl hero' + (k.profit < 0 ? ' loss' : '') + '" style="grid-column:span 2"><div class="k">' + (k.profit >= 0 ? 'กำไรสุทธิ' : 'ขาดทุนสุทธิ') + ' · ' + range.label() + '</div><div class="v">' + (k.profit < 0 ? '−' : '') + GG.baht(Math.abs(k.profit)) + '</div><div class="s">กำไรขั้นต้น − ค่าใช้จ่าย · อัตรากำไรสุทธิ ' + pct(k.profit, k.net) + '</div></div>';
      if (typeof Chart === 'undefined') return;
      var months = [], labels = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
      for (var m = 1; m <= 12; m++) { var key = '2026-' + String(m).padStart(2, '0'); months.push(calc(function (iso) { return iso.slice(0, 7) === key; })); }
      var s = getComputedStyle(document.documentElement), ink = s.getPropertyValue('--ink-2').trim(), grid = s.getPropertyValue('--border').trim();
      var data = { labels: labels, datasets: [
        { type: 'bar', label: 'ยอดขายสุทธิ', data: months.map(function (x) { return x.net; }), backgroundColor: s.getPropertyValue('--primary').trim(), borderRadius: 4, maxBarThickness: 22 },
        { type: 'bar', label: 'ต้นทุนขาย', data: months.map(function (x) { return x.cost; }), backgroundColor: s.getPropertyValue('--teal').trim(), borderRadius: 4, maxBarThickness: 22 },
        { type: 'bar', label: 'ค่าใช้จ่าย', data: months.map(function (x) { return x.exp; }), backgroundColor: s.getPropertyValue('--gold').trim(), borderRadius: 4, maxBarThickness: 22 },
        { type: 'line', label: 'กำไรสุทธิ', data: months.map(function (x) { return x.profit; }), borderColor: s.getPropertyValue('--rose').trim(), backgroundColor: s.getPropertyValue('--rose').trim(), tension: .3, pointRadius: 3 }] };
      if (plChart) { plChart.data = data; plChart.update(); return; }
      plChart = new Chart($('plChart'), { data: data, options: { maintainAspectRatio: false, animation: false, plugins: { legend: { position: 'bottom', labels: { color: ink, usePointStyle: true, font: { family: 'IBM Plex Sans Thai' } } }, tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + GG.baht(c.raw); } } } },
        scales: { x: { grid: { display: false }, ticks: { color: ink } }, y: { grid: { color: grid }, ticks: { color: ink, callback: function (v) { return (v < 0 ? '−฿' : '฿') + (Math.abs(v) >= 1000 ? (Math.abs(v) / 1000).toLocaleString('th-TH') + 'K' : Math.abs(v)); } } } } } });
    }
    draw();
  };

  show(location.hash.slice(1) || 'warehouse');
})();
/* wire every menu and draw every icon once the page content exists */
document.querySelectorAll('[data-menu]').forEach(GG.wireMenu);
GG.hydrateIcons(document);
</script>
</body>
</html>
